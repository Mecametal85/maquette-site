const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ouvrir(pw,garder){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(D.salt),iterations:D.it,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(D.iv)},key,b64(D.data)));
  if(garder) try{ sessionStorage.setItem('mm85',pw); }catch(e){}
  document.open(); document.write(html); document.close();
}
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault(); document.getElementById('err').textContent='Ouverture…';
  try{ await ouvrir(document.getElementById('p').value.trim().toLowerCase(),true); }
  catch(x){ document.getElementById('err').textContent='Mot de passe incorrect.'; }
};
// rechargement dans le même onglet : pas besoin de retaper le mot de passe
try{ const s=sessionStorage.getItem('mm85'); if(s) ouvrir(s,false).catch(()=>{}); }catch(e){}
